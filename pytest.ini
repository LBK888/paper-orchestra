[pytest]
testpaths = tests
# repo-local temp dir: avoids a stale/locked %TEMP%\pytest-of-<user> on Windows
addopts = -ra --basetemp=.pytest_tmp -p no:cacheprovider
markers =
    slow: end-to-end or rendering tests that take more than a few seconds (deselect with -m "not slow")
filterwarnings =
    ignore::DeprecationWarning
